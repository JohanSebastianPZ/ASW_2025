<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form action="" method="post" id="formulario">
        <fieldset>
            <legend>Datos personales</legend>
            
            <!--Nombre-->
            <label for="">Nombre:</label>
            <input type="text" name="" id="nombre" placeholder="Nombre" required>

            <!--Email-->
            <label for="">Email</label>
            <input type="email" name="" id="email" placeholder="Email" required>

            <!--Constraseña-->
            <label for="">Contraseña</label>
            <input type="password" name="" id="contrasena" placeholder="Contraseña" required>
            
            <!--Selector lenguaje-->
            <label for="">Seleccion su lenguaje favorito</label>
            <select name="selector" id="selector">
                <option value="JAVA">JAVA</option>
                <option value="JS">JS</option>
                <option value="PYTHON">PYTHON</option>
            </select>
            
            <!--Motivacio-->
            <label for="">Explica tu motivacion</label>
            <textarea name="" id="" maxlength="200" placeholder="Explica tu motivacion"></textarea>
            
            <button type="submit">Enviar</button>
        </fieldset>
    </form> 
    <script src="script.js"></script>   
</body>
</html>
